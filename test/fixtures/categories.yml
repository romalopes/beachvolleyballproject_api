# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

one:
  name: MyString
  slug: mystring-one

two:
  name: MyString
  slug: mystring-two

# The rubric an assessment is recorded against. A dedicated fixture keeps the
# assessment suite from depending on a category another suite may edit, and
# gives the serialized `category_label` a stable, readable value.
assessment_rubric:
  name: Attack
  slug: attack

# Categories used by the weighted-definition fixtures (Phase 5). `Attack` above
# already serves as the definition's Attack row — one name, one slug, no
# duplicate — so only the other two are added here.
defense:
  name: Defense
  slug: defense

serve:
  name: Serve
  slug: serve
