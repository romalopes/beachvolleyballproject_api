# Phase 6 (Assessment Sessions), plan §2: a roster a session can be run against.
#
# Two shapes, so the soft visibility rule has something real to prove: one shared
# group any coach may pick, and one private to the coach who recorded it.
#
# Fixtures are inserted with SQL, so `slug` is given explicitly rather than
# generated by the Sluggable callback.

u19_squad:
  name: U19 squad
  slug: u19-squad
  description: The under-19 training group.
  created_by: six
  visibility: shared
  status: active

private_squad:
  name: Private squad
  slug: private-squad
  created_by: three
  visibility: private
  status: active
