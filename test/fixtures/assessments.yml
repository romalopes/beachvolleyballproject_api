# Fixtures are inserted with SQL, so model validations do not run here — but the
# database check constraints do, which is exactly what should be pinned: an
# unrated draft is legal, a rated row outside 0..100 is not, and a rubric is
# always either a skill or free text.
#
# `users(:six)` is the only fixture user with a coach profile (maria_coach), so
# it is both the recorder and the attributed coach — the "stakeholder" case.

# Published club knowledge: skill-based, on a shared player.
skill_active:
  player_profile: pedro_player
  coach_profile: maria_coach
  created_by: six
  skill: assessment_rubric
  training_session: one
  score: 70
  reported_value: 4
  scale: one_to_five
  status: active
  notes: "Consistent platform; late on short serves."

# The free-text rubric branch, retracted by its author.
custom_withdrawn:
  player_profile: john_player
  coach_profile: maria_coach
  created_by: six
  custom_skill: "Court communication"
  score: 30
  reported_value: 3
  scale: one_to_ten
  status: withdrawn

# Finished but unpublished: only its stakeholders and oversight may see it.
# A 5/5 stores the midpoint of the top band (90), which is why a maximum
# rating is not 100 — the band table is the contract, not the label.
draft_ready:
  player_profile: pedro_player
  coach_profile: maria_coach
  created_by: six
  skill: assessment_rubric
  score: 90
  reported_value: 5
  scale: one_to_five
  status: draft

# Assigned but not yet rated — the case that makes the score pair nullable while
# the row is a draft.
draft_assigned:
  player_profile: john_player
  coach_profile: maria_coach
  created_by: six
  skill: assessment_rubric
  status: draft
