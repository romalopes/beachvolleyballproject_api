test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

neon:
  service: S3
  access_key_id: <%= ENV['NEON_S3_ACCESS_KEY_ID'] %>
  secret_access_key: <%= ENV['NEON_S3_SECRET_ACCESS_KEY'] %>
  region: <%= ENV['NEON_S3_REGION'] %> # e.g., us-east-2
  bucket: <%= ENV['NEON_S3_BUCKET_NAME'] %>
  # Neon's branch-specific S3 endpoint:
  endpoint: "https://<%= ENV['NEON_PROJECT_ID'] %>.s3.<region>.neon.tech"
  force_path_style: true

supabase:
  service: S3
  access_key_id: <%= ENV['SUPABASE_S3_ACCESS_KEY_ID'] %>
  secret_access_key: <%= ENV['SUPABASE_S3_SECRET_ACCESS_KEY'] %>
  region: <%= ENV['SUPABASE_S3_REGION'] %> # e.g., us-east-1
  bucket: <%= ENV['SUPABASE_S3_BUCKET_NAME'] %>
  endpoint: "https://<%= ENV['SUPABASE_PROJECT_REF'] %>.supabase.co/storage/v1/s3"
  force_path_style: true # Required for Supabase

cloudflare_r2:
  service: S3
  access_key_id: <%= ENV["CLOUD_FLARE_R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["CLOUD_FLARE_R2_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV["CLOUD_FLARE_R2_BUCKET"] %>
  # Custom endpoint format for Cloudflare R2:
  endpoint: "https://<%= ENV['CLOUD_FLARE_R2_REF'] %>.r2.cloudflarestorage.com"
  # Force path style is required for R2 & Backblaze compatibility
  force_path_style: true

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
